name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: realestate_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/realestate_test
      JWT_SECRET: ci-only-real-estate-secret-32-characters
      CORS_ORIGINS: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 'backend/package-lock.json' }
      - run: npm ci && npx prisma generate && npx prisma migrate deploy && npm test && npm audit --audit-level=high
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 'frontend/package-lock.json' }
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: frontend
